apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
      - name: hello-world
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: html
        configMap:
          name: hello-world-html
      - name: nginx-config
        configMap:
          name: hello-world-nginx-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certificate-status
  namespace: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: certificate-status
  template:
    metadata:
      labels:
        app: certificate-status
    spec:
      containers:
      - name: certificate-status
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: html
        configMap:
          name: certificate-status-html
      - name: nginx-config
        configMap:
          name: certificate-status-nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world-nginx-config
  namespace: demo-app
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        
        location /hello-world {
            alias /usr/share/nginx/html;
            try_files /index.html =404;
        }
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        location / {
            return 404;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: certificate-status-nginx-config
  namespace: demo-app
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        
        location /certificate-status {
            alias /usr/share/nginx/html;
            try_files /index.html =404;
        }
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        location / {
            return 404;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world-html
  namespace: demo-app
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Hello World - Service 1</title>
    </head>
    <body>
        <h1>Hello World - Service 1!</h1>
        <p>This is the first TLS-enabled application running on AWS Load Balancer Controller.</p>
        <p>Path: /hello-world</p>
        <p>Certificate validation successful!</p>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: certificate-status-html
  namespace: demo-app
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Certificate Status Dashboard</title>
        <style>
            body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin: 0; padding: 20px; }
            .container { max-width: 800px; margin: 0 auto; }
            .cert-card { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 20px; margin: 20px 0; backdrop-filter: blur(10px); }
            .status { font-size: 24px; font-weight: bold; color: #4CAF50; }
            .detail { margin: 10px 0; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 5px; }
            .blink { animation: blink 2s infinite; }
            .pulse { animation: pulse 3s infinite; }
            .slide { animation: slideIn 0.5s ease-out; }
            @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0.3; } }
            @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
            @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
            .lock { font-size: 48px; text-align: center; margin: 20px 0; }
            .counter { font-size: 20px; font-weight: bold; color: #FFD700; }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="lock pulse">🔒</div>
            <h1 style="text-align: center;">TLS Certificate Dashboard</h1>
            
            <div class="cert-card slide">
                <div class="status blink">✅ CERTIFICATE VALIDATED</div>
                <div class="detail"><strong>Path:</strong> /certificate-status</div>
                <div class="detail"><strong>Encryption:</strong> TLS 1.3 with AES-256-GCM</div>
                <div class="detail"><strong>Certificate Authority:</strong> AWS Certificate Manager</div>
                <div class="detail"><strong>Load Balancer:</strong> Application Load Balancer (ALB)</div>
                <div class="detail"><strong>Backend Protocol:</strong> HTTP (TLS terminated at ALB)</div>
                <div class="detail"><strong>Uptime:</strong> <span class="counter" id="uptime">0</span> seconds</div>
            </div>
            
            <div class="cert-card slide" style="animation-delay: 0.2s;">
                <h3>🚀 Demo Features Active</h3>
                <div class="detail">✓ DNS Validation via external-dns</div>
                <div class="detail">✓ Automatic certificate provisioning</div>
                <div class="detail">✓ Path-based routing demonstration</div>
                <div class="detail">✓ Pod Identity authentication</div>
                <div class="detail">✓ Internet-facing load balancer</div>
                <div class="detail"><strong>Page Views:</strong> <span class="counter" id="views">1</span></div>
            </div>
            
            <div style="text-align: center; margin-top: 30px; font-size: 18px;" class="slide" style="animation-delay: 0.4s;">
                <p>🎯 <strong>Containers + Certificates = Secure!</strong></p>
                <p><small>Last updated: <span id="timestamp"></span></small></p>
            </div>
        </div>
        
        <script>
            let startTime = Date.now();
            let views = parseInt(localStorage.getItem('views') || '0') + 1;
            localStorage.setItem('views', views);
            document.getElementById('views').textContent = views;
            document.getElementById('timestamp').textContent = new Date().toLocaleString();
            
            setInterval(() => {
                document.getElementById('uptime').textContent = Math.floor((Date.now() - startTime) / 1000);
            }, 1000);
        </script>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world-service
  namespace: demo-app
spec:
  selector:
    app: hello-world
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: certificate-status-service
  namespace: demo-app
spec:
  selector:
    app: certificate-status
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
